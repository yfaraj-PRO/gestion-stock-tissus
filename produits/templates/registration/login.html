<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 60px auto; max-width: 320px; }
        input { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>Connexion</h1>
    {% if form.errors %}<p style="color: red;">Identifiant ou mot de passe incorrect.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Identifiant</label>
        {{ form.username }}
        <label>Mot de passe</label>
        {{ form.password }}
        <button type="submit">Se connecter</button>
    </form>
</body>
</html>
